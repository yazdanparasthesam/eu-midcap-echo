version: "3.9"
services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
      - ./reports:/app/reports
    env_file:
      - .env
    command: python scripts/run_pipeline.py --full

  daily:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
      - ./reports:/app/reports
    env_file:
      - .env
    command: python scripts/daily_predict.py
